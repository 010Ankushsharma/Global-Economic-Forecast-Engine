global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gefe-backend'
    static_configs:
      - targets: ['gefe-backend:8000']
    metrics_path: /metrics
    
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187']
      
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
      
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
